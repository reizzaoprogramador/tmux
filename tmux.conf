# ==============================================================================
# @file: ~/.config/tmux/tmux.conf
# @mission: Configuração do Tmux com fundo totalmente transparente, atalhos Vim, persistência e padrão XDG
# ==============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Define o prefixo principal para Ctrl + Space (melhor prefixo)
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Mantém o servidor rodando mesmo sem janelas ativas (evita fechar tudo) # @important
set -g detach-on-destroy off

# Atalho para criar uma nova sessão separada solicitando o nome na barra inferior = prefixo+C
bind C-c command-prompt -p "Nome da nova sessão:" "new-session -s '%%'"

# Atalho para recarregar as configurações sem reiniciar o tmux
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "tmux.conf recarregado!"

# Seleção de painéis estilo Vim (com o prefixo: Ctrl+Space + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Divisão horizontal mantendo o diretório atual (Corrigido o escape da barra)
unbind %
bind \\ split-window -h -c "#{pane_current_path}"

# Divisão vertical mantendo o diretório atual
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Mudança de indexação de 0 para 1 devido ao layout do teclado
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alternar janelas usando Prefixo + Setas (Garante 100% de funcionamento sem conflito com o terminal)
bind Left previous-window
bind Right next-window

# Selecionar janelas de 1 a 9 usando Prefixo + Número (Garantido e sem falhas do Alt)
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Cores do tema Tokyonight Moon
thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

# Barra de status
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Mensagens
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Painéis
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Janelas
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Linha de status - janela atual (mostra o diretório resumido)
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_magenta},bg=${thm_bg}](✓) #[fg=${thm_cyan},bg=${thm_bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_magenta},bg=${thm_bg}]"

# Linha de status - outras janelas
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_fg},bg=${thm_bg}]#W"

# Linha de status - lado direito
set -g status-right "#[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S "

# Linha de status - lado esquerdo (vazio)
set -g status-left ""

# Modos (ex: modo de cópia)
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

# == Atalhos validados e funcionais ==
# -- prefixo + c : cria nova janela
# -- prefixo + C : cria nova sessão separada
# -- prefixo + r : recarrega configurações
# -- prefixo + \ : divide tela na horizontal
# -- prefixo + - : divide tela na vertical
# -- prefixo + h/j/k/l : alterna painéis
# -- prefixo + Setas : alterna janelas anterior/proxima
# -- prefixo + 1-9 : seleciona janelas diretamente

