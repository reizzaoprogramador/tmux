# ==============================================================================
# @file: ~/.config/tmux/tmux.conf
# @mission: Configuração do Tmux com fundo totalmente transparente, atalhos Vim, persistência e padrão XDG
# ==============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Mantido o default Ctrl+B
set -g prefix C-b
bind-key C-b send-prefix

# Caminho onde os plugins são salvos (Alinhado ao padrão XDG)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste & Modos
set-window-option -g mode-keys vi
bind Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Cores Tokyonight (Textos/acentos, fundo transparente)
thm_cyan="#86e1fc"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_blue="#82aaff"
thm_fg="#c8d3f5"
thm_black4="#444a73"

# Status bar com fundo transparente
set -g status "on"
set -g status-bg "default"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages (fundo transparente)
set -g message-style "fg=${thm_cyan},bg=default,align=centre"
set -g message-command-style "fg=${thm_cyan},bg=default,align=centre"

# Panes (bordas discretas)
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows (fundo transparente)
set -g window-status-activity-style "fg=${thm_fg},bg=default,none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=default,none"

# Statusline - current window (fundo transparente)
set -g window-status-current-format "#[fg=${thm_blue},bg=default] #I: #[fg=${thm_magenta},bg=default](✓) #[fg=${thm_cyan},bg=default]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_magenta},bg=default]"

# Statusline - other windows (fundo transparente)
set -g window-status-format "#[fg=${thm_blue},bg=default] #I: #[fg=${thm_fg},bg=default]#W"

# Statusline - right side (fundo transparente)
set -g status-right "#[fg=${thm_blue},bg=default] #[fg=${thm_fg},bg=default] #W #[fg=${thm_magenta},bg=default]#{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]} #{?client_prefix,PREFIX,NORMAL} #[fg=${thm_fg},bg=default] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

# ==============================================================================
# @mission: Configuração de persistência de sessões com tmux-resurrect e tmux-continuum
# ==============================================================================

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Ativa restauração automática pós-boot
set -g @continuum-restore 'on'

# Inicializa o TPM (Deve ser estritamente a última linha)
run '~/.config/tmux/plugins/tpm/tpm'

# ==============================================================================
# @README_FILE
#
# @IMPORTANTE_PROFILE: Tmux configurado com transparência total, atalhos Vim, 
# persistência automática de sessões e caminhos totalmente XDG-compliant.
# ==============================================================================